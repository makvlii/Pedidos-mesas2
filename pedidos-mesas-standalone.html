<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedidos por Mesa</title>
<style>
:root{
  --bg:#faf8f5;--card:#fff;--text:#2b2420;--muted:#8a7f74;--accent:#b5502d;--border:#e6ddd3;--ok:#3f7d47;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1c1815;--card:#26211d;--text:#efe8e0;--muted:#a89c8f;--accent:#e07a4f;--border:#3a332c;--ok:#6fbf78;}
}
:root[data-theme="dark"]{--bg:#1c1815;--card:#26211d;--text:#efe8e0;--muted:#a89c8f;--accent:#e07a4f;--border:#3a332c;--ok:#6fbf78;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;height:100%;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
.wrap{max-width:480px;margin:0 auto;padding:1.2rem 1rem 3rem;}
h1{font-size:1.2rem;margin:0 0 .2rem;}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:1rem;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:1rem;}
.table-btn{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:.8rem 0;text-align:center;font-weight:bold;color:var(--text);}
.table-btn.open{border-color:var(--ok);color:var(--ok);}
.panel{display:none;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;margin-top:.5rem;}
.panel.show{display:block;}
.row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.4rem 0;border-bottom:1px solid var(--border);}
.row:last-child{border-bottom:none;}
.qty{display:flex;align-items:center;gap:.4rem;}
.qty button{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:1rem;}
.menu-item{display:flex;justify-content:space-between;padding:.4rem .2rem;border-bottom:1px dashed var(--border);}
.menu-item span.p{color:var(--muted);}
.add-btn{border:none;background:var(--accent);color:#fff;border-radius:6px;padding:.3rem .6rem;font-size:.85rem;}
.total{display:flex;justify-content:space-between;font-weight:bold;font-size:1.1rem;margin-top:.6rem;padding-top:.6rem;border-top:2px solid var(--border);}
.actions{display:flex;gap:.5rem;margin-top:1rem;}
.actions button{flex:1;padding:.7rem;border-radius:8px;border:none;font-weight:bold;font-size:.9rem;}
.btn-kitchen{background:#2f6f8f;color:#fff;}
.btn-close{background:var(--ok);color:#fff;}
.back{background:none;border:none;color:var(--accent);font-size:.9rem;margin-bottom:.5rem;padding:0;}
.settings{font-size:.8rem;color:var(--muted);margin-top:1.5rem;}
.settings input{width:100%;padding:.4rem;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);margin-top:.3rem;}
.empty{color:var(--muted);font-size:.85rem;padding:.5rem 0;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Pedidos por Mesa</h1>
  <div class="sub">Toca una mesa para tomar el pedido</div>
  <div class="grid" id="grid"></div>

  <div class="panel" id="panel">
    <button class="back" onclick="closePanel()">← Volver a mesas</button>
    <h2 id="panelTitle" style="margin:.2rem 0;"></h2>
    <div id="menuList"></div>
    <div id="orderList" style="margin-top:.8rem;"></div>
    <div class="total"><span>Total</span><span id="totalAmt">$0</span></div>
    <div class="actions">
      <button class="btn-kitchen" onclick="sendToKitchen()">Enviar a cocina</button>
      <button class="btn-close" onclick="closeTable()">Cobrar / Cerrar</button>
    </div>
  </div>

  <div class="settings">
    Número de WhatsApp de cocina (con código de país, sin +):
    <input id="kitchenPhone" placeholder="5215512345678" />
  </div>
</div>

<script>
const N_TABLES = 12;
const MENU = [
  {n:"Agua fresca", p:25}, {n:"Refresco", p:20}, {n:"Cerveza", p:45},
  {n:"Café", p:22}, {n:"Sopa del día", p:60}, {n:"Ensalada", p:70},
  {n:"Plato fuerte", p:120}, {n:"Taco orden", p:65}, {n:"Postre", p:50}
];

let state = JSON.parse(localStorage.getItem('mesas_state') || '{}');
let current = null;

function fmt(v){ return "$" + v.toFixed(0); }

function renderGrid(){
  const g = document.getElementById('grid');
  g.innerHTML = '';
  for(let i=1;i<=N_TABLES;i++){
    const t = state[i];
    const open = t && t.items && t.items.length;
    const b = document.createElement('button');
    b.className = 'table-btn' + (open ? ' open' : '');
    b.textContent = 'Mesa ' + i;
    b.onclick = () => openPanel(i);
    g.appendChild(b);
  }
}

function openPanel(i){
  current = i;
  if(!state[i]) state[i] = {items:[], status:'open'};
  document.getElementById('panelTitle').textContent = 'Mesa ' + i;
  document.getElementById('menuList').innerHTML = MENU.map((m,idx)=>
    `<div class="menu-item"><span>${m.n} <span class="p">${fmt(m.p)}</span></span>
     <button class="add-btn" onclick="addItem(${idx})">+ Agregar</button></div>`
  ).join('');
  document.getElementById('panel').classList.add('show');
  renderOrder();
}

function closePanel(){
  document.getElementById('panel').classList.remove('show');
  current = null;
}

function addItem(idx){
  const m = MENU[idx];
  const items = state[current].items;
  const ex = items.find(x=>x.n===m.n);
  if(ex) ex.qty++; else items.push({n:m.n,p:m.p,qty:1});
  save();
}

function changeQty(i, delta){
  const items = state[current].items;
  items[i].qty += delta;
  if(items[i].qty <= 0) items.splice(i,1);
  save();
}

function renderOrder(){
  const items = state[current] ? state[current].items : [];
  const ol = document.getElementById('orderList');
  if(!items.length){
    ol.innerHTML = '<div class="empty">Sin productos aún</div>';
  } else {
    ol.innerHTML = items.map((it,i)=>`
      <div class="row">
        <span>${it.n}</span>
        <div class="qty">
          <button onclick="changeQty(${i},-1)">−</button>
          <span>${it.qty}</span>
          <button onclick="changeQty(${i},1)">+</button>
          <span style="min-width:50px;text-align:right;">${fmt(it.p*it.qty)}</span>
        </div>
      </div>`).join('');
  }
  const total = items.reduce((s,it)=>s+it.p*it.qty,0);
  document.getElementById('totalAmt').textContent = fmt(total);
  renderGrid();
}

function sendToKitchen(){
  const items = state[current].items;
  if(!items.length){ alert('No hay productos que enviar.'); return; }
  const phone = document.getElementById('kitchenPhone').value.trim();
  const lines = items.map(it => `${it.qty}x ${it.n}`).join('\n');
  const msg = `Mesa ${current}:\n${lines}`;
  const url = 'https://wa.me/' + (phone || '') + '?text=' + encodeURIComponent(msg);
  window.open(url, '_blank');
}

function closeTable(){
  if(!confirm('¿Cerrar y cobrar Mesa ' + current + '?')) return;
  state[current] = {items:[], status:'closed'};
  save();
  closePanel();
}

function save(){
  renderOrder();
  try{ localStorage.setItem('mesas_state', JSON.stringify(state)); }catch(e){}
}

function loadKitchenPhone(){
  try{
    const phone = localStorage.getItem('kitchen_phone');
    if(phone) document.getElementById('kitchenPhone').value = phone;
  }catch(e){}
}
document.getElementById('kitchenPhone').addEventListener('change', (e)=>{
  try{ localStorage.setItem('kitchen_phone', e.target.value.trim()); }catch(err){}
});

function init(){
  loadKitchenPhone();
  renderGrid();
}
init();
</script>
</body>
</html>
